<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">
    <title>Document</title>
    <style>

body{
    background-color: #191919;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
  
#timer {
  color: #D49675;
  text-align: center;
  text-transform: uppercase;
  font-family: 'Lato', sans-serif;
  font-size: clamp(0.45rem, 2vw, 0.7rem);
  letter-spacing: clamp(1px, 0.5vw, 5px);

  display: flex;
  justify-content: center;
  gap: clamp(5px, 1.5vw, 8px);
}

.days, .hours, .minutes {
  width: clamp(80px, 18vw, 110px);
  height: clamp(80px, 18vw, 110px);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: clamp(8px, 3vw, 20px);
  border-radius: 5px;
  box-sizing: border-box;
  text-align: center;
}

.days {
  background: #4C3E35;
}

.hours {
  background: #4C3E35;
  color: #D49675;
}

.minutes {
  background: #4C3E35;
}

.seconds {
  background: #4C3E35;
}

.numbers {
  font-family: 'Montserrat', sans-serif;
  color:  #D49675;
  font-size: clamp(2em, 6vw, 3em);
  text-align: center;
}

.white {
  position: absolute;
  background:  #ffffff00;
  height: 85px;
  width: 75px;
  left: 30%;
  top: 2%;
}

.red {
  position: absolute;
  background:  #ef2f3c00;
  left: 18%;
  top: 9%;
  height: 65px;
  width: 70px;
}

.blue {
  position: absolute;
  background:  #276ebf00;
  height: 80px;
  width: 80px;
  left: 60%;
  top: 5%;
}


    </style>
</head>
<body>
    
<div id="timer">

    <div class="days"> 
        <div id="days" class="numbers "> </div>days</div> 
      <div class="hours"> 
        <div  id="hours" class="numbers"> </div>hours</div> 
      <div class="minutes"> 
        <div  id="minutes" class="numbers"> </div>minutes</div> 
      
      </div>

</div>

</body>
<script>
    const year = new Date().getFullYear();
const myDate = new Date('Dec 11, 2026 12:10:00');
console.log(myDate);

// countdown
let timer = setInterval(function() {

  // get today's date
  const today = new Date().getTime();

  // get the difference
  const diff = myDate - today;

  // math
  let days = Math.floor(diff / (1000 * 60 * 60 * 24));
  let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

  // display
  document.getElementById("days").innerHTML=days
  document.getElementById("hours").innerHTML=hours
  document.getElementById("minutes").innerHTML=minutes


}, 1);
</script>
</html>
