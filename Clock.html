<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">
    <title>Document</title>
    <style>

html, body {
    background-color: #191919;
    margin: 0;
    padding: 0;
    overflow: hidden;
    min-height: 0;
}

#timer {
  text-align: center;
  font-family: 'Lato', sans-serif;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: clamp(5px, 1.5vw, 8px);
}

.wrapper {
  width: fit-content;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hours, .minutes {
  width: clamp(60px, 16vw, 100px);
  height: clamp(80px, 18vw, 110px);

  display: flex;
  align-items: center;
  justify-content: center;
  
  padding: clamp(8px, 3vw, 20px);
  border-radius: 5px;
  position: relative;
  box-sizing: border-box;
}

.hours {
  background: #4C3E35;
}

.minutes {
  background: #4C3E35;
}

.numbers {
  font-family: 'Montserrat', sans-serif;
  color:  #D49675;
  font-size: clamp(1.5rem, 8vw, 3rem);
  text-align: center;
  line-height: 1;
}

.seconds {
  position: absolute;
  bottom: 6px;
  right: 10px;
  font-family: 'Lato', sans-serif;
  color: #D49675;
  font-size: clamp(0.6rem, 2vw, 0.8rem);
  line-height: 1;
}

.weekday {
  position: absolute;
  top: 6px;
  left: 10px;
  font-family: 'Lato', sans-serif;
  color: #D49675;
  font-size: clamp(0.6rem, 2vw, 0.8rem);
  text-transform: uppercase;
  line-height: 1;
}

    </style>
</head>

<body>

  <div class="wrapper">

    <div id="timer">

        <div class="hours">
          <div id="weekday" class="weekday"> </div>
          <div id="hours" class="numbers"> </div>
        </div>
        <div class="minutes">
          <div id="minutes" class="numbers"> </div>
          <div id="seconds" class="seconds"> </div>
        </div>

    </div>
    
  </div>

</body>
<script>

function pad(n) {
  return n.toString().padStart(2, '0');
}

const dias = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

function updateClock() {
  const now = new Date();

  let hours = now.getHours();
  let minutes = now.getMinutes();
  let seconds = now.getSeconds();

  document.getElementById("hours").innerHTML = pad(hours);
  document.getElementById("minutes").innerHTML = pad(minutes);
  document.getElementById("seconds").innerHTML = pad(seconds);
  document.getElementById("weekday").innerHTML = dias[now.getDay()];
}

updateClock();
setInterval(updateClock, 1000);

</script>
</html>
